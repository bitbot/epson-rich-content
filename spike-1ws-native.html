<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Spike: 1WS Native CDN</title>
<script>
  window["ccs_cc_initParams"] = ["d5eea376", "ws.cs.1worldsync.com"];
</script>
<style>
  body {
    margin: 0; padding: 0; background: #fff;
    font-family: "motiva-sans", Motiva, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { display: block !important; flex-direction: unset !important; }
  /* Simulates a retailer iframe container. Staples uses ~1400px.
     1WS CSS handles inner containment (ccs-hotspots at 1200px, etc). */
  #app { max-width: 1400px; margin: 0 auto; }
  .preview-expanded .ccs-cc-inline-section + .ccs-cc-inline-section { margin-top: 40px !important; }
  .preview-expanded .ccs-cc-inline-section.ccs-cc-inline-features .ccs-cc-inline-features-block + .ccs-cc-inline-features-block { margin-top: 4px !important; }
  .preview-expanded .ccs-hotspots-expanded-instance + .ccs-hotspots-expanded-instance { margin-top: 4px !important; }
  .preview-expanded .ccs-cc-fc-custom-controls, .preview-expanded .ccs-cc-fc-arrows { display: none !important; }
  /* Expanded hotspot: use 1WS .ccs-hotspots-default wrapper so CDN CSS handles point styling.
     Only the active point is visible; others hidden. Popup positioned at the point with connector. */
  .ccs-hotspots-expanded-instance .ccs-hotspots-point { display: none; }
  .ccs-hotspots-expanded-instance .ccs-hotspots-point.ccs-hotspots-point-active { display: block; }
  .ccs-hotspot-expanded-popup {
    position: absolute; z-index: 4; pointer-events: none;
  }
  .ccs-hotspot-expanded-popup .qtip-light {
    position: relative; width: 300px; background: #fff; border: 1px solid #e2e2e2;
    box-shadow: 1px 1px 3px 1px rgba(0,0,0,0.15); color: #454545;
  }
  /* Connector arrow */
  .ccs-hotspot-expanded-popup .qtip-tip {
    position: absolute; width: 12px; height: 12px;
    background: #fff; border: 1px solid #e2e2e2;
    transform: rotate(45deg); z-index: 1;
  }
  .ccs-hotspot-expanded-popup[data-pos="left"] .qtip-tip { right: -7px; top: 50%; margin-top: -6px; border-left: 0; border-bottom: 0; }
  .ccs-hotspot-expanded-popup[data-pos="right"] .qtip-tip { left: -7px; top: 50%; margin-top: -6px; border-right: 0; border-top: 0; }
  .ccs-hotspot-expanded-popup .qtip-content { padding: 0 16px; line-height: 1.5; }
  .ccs-hotspot-expanded-popup .qtip-content > div { padding: 16px 0; }
  .ccs-hotspot-expanded-popup .qtip-content > div > * + * { margin-top: 0.7em; }
  .ccs-hotspot-expanded-popup .qtip-content img { display: block; margin: 0 auto; max-width: 100%; }
  .ccs-hotspot-expanded-popup .qtip-content h4 { text-align: center; font-size: 1.2em; }
</style>
</head>
<body>
<div id="app"></div>

<script>
var INLINE_CONTENT_ID = 'inline-spike';


// Image transform URL builder — mirrors 1WS CDN pattern (e.g. width(1200).jpg)
// Uses the /img/ Pages Function for dynamic resizing.
function imgTransform(path, transforms) {
  if (!path || path.indexOf("http") === 0) return path;
  if (path.charAt(0) !== "/") path = "/" + path;
  return "/img/" + transforms + path;
}
function getRoute() {
  var params = new URLSearchParams(window.location.search);
  return { expanded: params.get('expand') === 'all' || params.get('expanded') === 'all' };
}

function loadProduct() {
  var r = getRoute();
  var app = document.getElementById('app');
  app.innerHTML = '<div style="padding:40px;text-align:center;color:#999;font-family:sans-serif">Loading...</div>';
  fetch('/data/et-2980u.json')
    .then(function(res) { if (!res.ok) throw new Error('Not found'); return res.json(); })
    .then(function(data) { renderProduct(data, r.expanded); })
    .catch(function(err) {
      app.innerHTML = '<div style="padding:40px;text-align:center;color:#c00;font-family:sans-serif">' + err.message + '</div>';
    });
}

function renderProduct(data, expanded) {
  var cls = 'ccs-cc-inline ccs-cc-inline-eps ccs-cc-lang-enusa ccs-cc-lightbox-disabled ccs-cc-block-inline';
  if (expanded) cls += ' preview-expanded';
  var html = '<div id="' + INLINE_CONTENT_ID + '" class="' + cls + '">';
  html += '<div class="ccs-clear"></div>';
  // Hero + first carousel share a features section wrapper (matches 1WS reference structure)
  html += '<div data-elementid="inline-content-features[eps]" data-context=\'{"mobile":false}\' class="ccs-cc-inline-section ccs-cc-inline-features" data-display-mode="noheader">';
  html += renderFeatureBlock(data.hero, true);
  if (data.disclaimerStrip) {
    html += '</div>'; // close features section before disclaimer strip
    html += renderTextOnly(data.disclaimerStrip.content, data.disclaimerStrip.bgColor, data.disclaimerStrip.fgColor);
    html += '<div data-elementid="inline-content-features[eps]" data-context=\'{"mobile":false}\' class="ccs-cc-inline-section ccs-cc-inline-features" data-display-mode="noheader">';
  }
  if (data.carousels.length > 0) {
    html += renderCarouselInner(data.carousels[0], expanded);
  }
  html += '</div>'; // close first features section
  for (var i = 1; i < data.carousels.length; i++) {
    html += renderCarouselSection(data.carousels[i], expanded);
  }
  html += renderHotspotsSection(data.hotspots, expanded);
  var disclaimerContent = typeof data.disclaimers === 'string' ? data.disclaimers : (data.disclaimers && data.disclaimers.content ? data.disclaimers.content : '');
  if (disclaimerContent) html += renderTextOnly(disclaimerContent);
  html += '<div class="ccs-cc-inline-ensure-style-loaded" style="display:none;width:0;height:0;"></div>';
  html += '</div>';
  document.getElementById('app').innerHTML = html;
  document.title = data.product.name + ' — 1WS Native Spike';
  if (!expanded) { window._1wsHtmlReady = true; }
}

function renderFeatureBlock(slide, isHero) {
  var bgPos = slide.bgPosition || 'center';
  var imgUrl = slide.image;
  if (imgUrl && imgUrl.indexOf('http') !== 0) imgUrl = '/' + imgUrl;
  var html = '<div class="ccs-cc-inline-features-block ccs-cc-inline-overlay ccs-cc-aspect-ratio" data-background="image" style="--ratio:' + slide.ratio + '">';
  html += '<div class="ccs-cc-inline-feature-background-mobile"><img src="' + imgUrl + '" alt="' + (slide.alt || '') + '"/></div>';
  html += '<div class="ccs-cc-inline-feature-background" style="background-color:#ffffff; padding-top:' + slide.paddingTop + "; background-image:url('" + imgUrl + "'); background-size:cover; background-repeat:no-repeat; background-position:" + bgPos + '; background-attachment:scroll"></div>';
  var hasText = !isHero && slide.heading;
  var dataType = hasText ? 'text' : '';
  var twu = hasText ? 'true' : 'false';
  var dw = hasText ? '100%' : '45%';
  html += '<div class="ccs-cc-inline-overlay-outer"><div class="ccs-cc-inline-overlay-inner ccs-cc-inline-feature" data-type="' + dataType + '" data-desktop-media="false" data-text-row-position="center" data-text-column-position="left" data-media-row-position="center" data-media-column-position="right" data-text-width-unlimited="' + twu + '" data-media-size-unlimited="false">';
  html += '<div class="ccs-cc-inline-feature-content ccs-cc-inline-feature-media-container" style=""></div>';
  html += '<div class="ccs-cc-inline-feature-content ccs-cc-inline-feature-description-container" style="width:' + dw + '">';
  html += '<div class="ccs-cc-inline-feature-content ccs-cc-inline-feature-description" style="' + (hasText ? 'color:#ffffff; background-color:rgba(0, 0, 0, 0.7);' : '') + '">';
  if (hasText) {
    html += '<span style="font-size: 1.44em;"><b>' + slide.heading + '</b></span><div><br></div>' + (slide.body || '');
  }
  html += '</div></div></div></div></div>';
  return html;
}

function renderCarouselInner(carousel, expanded) {
  // Renders carousel content WITHOUT a section wrapper (for when it's inside an existing section)
  var html = '';
  if (expanded) {
    for (var i = 0; i < carousel.slides.length; i++) {
      html += renderFeatureBlock(carousel.slides[i], false);
    }
  } else {
    html += '<div class="ccs-cc-inline-features-block ccs-cc-fc ccs-cc-inline-noautoplay">';
    html += '<div class="ccs-cc-fc-items" tabindex="0">';
    for (var j = 0; j < carousel.slides.length; j++) {
      html += renderFeatureBlock(carousel.slides[j], false);
    }
    html += '</div>';
    html += '<div class="ccs-cc-fc-custom-controls"><a class="ccs-cc-fc-play-pause-btn ccs-pause" href="javascript:;" role="button" data-role="none" aria-label="click to pause"><span></span></a></div>';
    html += '<div class="ccs-cc-fc-arrows"><a class="ccs-cc-fc-arrow ccs-slick-prev" href="javascript:;" role="button" data-role="none" aria-label="show previous slide"><span></span></a><a class="ccs-cc-fc-arrow ccs-slick-next" href="javascript:;" role="button" data-role="none" aria-label="show next slide"><span></span></a></div>';
    html += '</div>';
  }
  return html;
}

function renderCarouselSection(carousel, expanded) {
  // Renders carousel WITH its own section wrapper (for standalone carousels)
  return '<div data-elementid="inline-content-features[eps]" data-context=\'{"mobile":false}\' class="ccs-cc-inline-section ccs-cc-inline-features" data-display-mode="noheader">' + renderCarouselInner(carousel, expanded) + '</div>';
}

function renderHotspotsSection(hotspots, expanded) {
  var html = '<div data-elementid="inline-content-hotspots[eps]" data-context=\'{"mobile":false}\' class="ccs-cc-inline-section ccs-cc-inline-hotspots" data-display-mode="noheader">';
  if (!expanded) {
    var imgUrl = imgTransform(hotspots.compositeImage, 'width(1200)');
    var hsData = [];
    for (var i = 0; i < hotspots.points.length; i++) {
      var pt = hotspots.points[i];
      var pUrl = imgTransform(pt.popupImage, 'width(400)');
      hsData.push({ x: pt.x, y: pt.y, type: 'textimage', title: pt.heading.replace(/<[^>]*>/g, ''), description: pt.body, mediaUrl: pUrl, transcodedUrl: '', previewUrl: '', altText: (pt.popupAlt || pt.heading).replace(/<[^>]*>/g, '') });
    }
    html += '<div class="ccs-hotspots-container"><img loading="lazy" src="' + imgUrl + '" alt="' + (hotspots.compositeAlt || '') + '" class="ccs-hotspots-image" data-hotspots=\'' + JSON.stringify(hsData).replace(/'/g, '&#39;') + '\' /></div>';
  } else {
    for (var k = 0; k < hotspots.points.length; k++) {
      var pt2 = hotspots.points[k];
      var cImg = imgTransform(hotspots.compositeImage, 'width(1200)');
      var pImg = imgTransform(pt2.popupImage, 'width(400)');
      // Use .ccs-hotspots.ccs-hotspots-default wrapper so 1WS CSS handles point styling
      html += '<div class="ccs-hotspots-container ccs-hotspots-expanded-instance">';
      html += '<div class="ccs-hotspots ccs-hotspots-default" style="display:inline-block;position:relative">';
      html += '<img src="' + cImg + '" alt="' + (hotspots.compositeAlt || '') + '" style="width:100%;display:block" />';
      // Render all points but only mark the current one active
      for (var m = 0; m < hotspots.points.length; m++) {
        var ptm = hotspots.points[m];
        var activeClass = (m === k) ? ' ccs-hotspots-point-active' : '';
        html += '<div class="ccs-hotspots-point' + activeClass + '" tabindex="0" style="top:calc(' + (ptm.y*100) + '% - 16px);left:calc(' + (ptm.x*100) + '% - 16px)" aria-label="' + ptm.heading.replace(/<[^>]*>/g, '').replace(/"/g, '&quot;') + '"></div>';
      }
      // Popup to the side of the point, vertically centered in the component
      var popSide = pt2.x < 0.5 ? 'right' : 'left';
      var popStyle;
      if (popSide === 'left') {
        popStyle = 'top:50%;right:' + ((1 - pt2.x)*100 + 2) + '%;transform:translateY(-50%);padding-right:10px';
      } else {
        popStyle = 'top:50%;left:' + (pt2.x*100 + 2) + '%;transform:translateY(-50%);padding-left:10px';
      }
      html += '<div class="ccs-hotspot-expanded-popup" data-pos="' + popSide + '" style="' + popStyle + '"><div class="qtip-light ccs-hotspots-tooltip"><div class="qtip-tip"></div><div class="qtip-content"><div>';
      if (pImg) html += '<img src="' + pImg + '" alt="' + (pt2.popupAlt || pt2.heading).replace(/"/g,'&quot;') + '" />';
      html += '<h4>' + pt2.heading + '</h4><p>' + pt2.body + '</p></div></div></div></div>';
      html += '</div></div>';
    }
  }
  html += '</div>';
  return html;
}

function renderTextOnly(content, bgColor, fgColor) {
  var style = '';
  if (bgColor) style += 'background-color:' + bgColor + ';';
  if (fgColor) style += 'color:' + fgColor + ';';
  if (bgColor) style += 'padding:12px 16px;';
  return '<div data-elementid="inline-content-features[eps]" data-context=\'{"mobile":false}\' class="ccs-cc-inline-section ccs-cc-inline-features" data-display-mode="noheader"><div class="ccs-cc-inline-features-block ccs-cc-inline-single-feature"><div class="ccs-cc-inline-feature" data-type="text"><div class="ccs-cc-inline-feature-content ccs-cc-inline-feature-description"' + (style ? ' style="' + style + '"' : '') + '><!--\n-->' + content + '<!--\n--></div></div></div></div>';
}

function init1WS() {
  if (typeof ccs_require === 'undefined') { setTimeout(init1WS, 50); return; }
  var initFn;
  try { initFn = ccs_require('inlineContent'); } catch(e) {}
  if (typeof initFn !== 'function') { setTimeout(init1WS, 100); return; }
  initFn({
    inlineContentId: INLINE_CONTENT_ID,
    logCall: '{"logFunctionName":"ccs_cc_noop","paramsFunctionName":"ccs_cc_noop","eventId":"spike"}',
    isRtl: false,
    containerClass: 'ccs-cc-inline-eps',
    video: { pluginPath: 'https://cdn.cs.1worldsync.com/static/pe/26_5_12_2/26_5_12_2/Content/videoPlayer/mediaelementjs3/', disableCC: false },
    lightbox: { disabled: true, backButtonText: 'Back', poweredByLogoUrl: '', poweredByAltText: '' },
    jumplinks: { enabled: false, description: '' },
    media: { showLargeImg: 'show larger image', zoomIn: 'zoom in', slidePosition: 'slide {0} of {1}' },
    features: { autoPlayVideoInViewPort: false, carousel: { speed: 5000, arrows: true, points: true, playpause: false }, disableLazyLoad: true, swapBreakpoint: 570, zoom: { enabled: false } },
    hotspots: {},
    accordion: { expandedText: 'hides content', collapsedText: 'shows more content' },
    spritespin: null,
    footer: { anchorOffScreenText: 'footnote' },
    product: null,
    comparisonTable: null,
    augmentedReality: { autoLoad: false, launchInLightbox: false, autoLaunchAr: false, qrDisplayMode: 'page' }
  });
  var eq;
  try { eq = ccs_require('ElementQueries'); } catch(e) {}
  if (eq && eq.init) { eq.init('#' + INLINE_CONTENT_ID, { 'max-width': [570, 790, 680, 900] }); }
}

window.ccs_cc_noop = function() {};
loadProduct();
</script>

<link href="https://cdn.cs.1worldsync.com/syndication/inlinecontent/fonts/motivasans/stylesheet.css" rel="stylesheet">
<link href="https://cdn.cs.1worldsync.com/static/pe/26_5_12_2/26_5_12_2/Content/ContentCast/Inline/Inline.css" rel="stylesheet">
<link href="https://cdn.cs.1worldsync.com/static/pe/26_5_12_2/26_5_12_2/Content/ContentCast/Inline/themes/nogap.css" rel="stylesheet">
<link href="https://cdn.cs.1worldsync.com/static/pe/26_5_12_2/26_5_12_2/Content/fancybox3/jquery.fancybox.css" rel="stylesheet">
<link href="https://cdn.cs.1worldsync.com/static/pe/26_5_12_2/26_5_12_2/Content/videoPlayer/mediaelementjs3/mediaelementjs.css" rel="stylesheet">

<script src="https://cdn.cs.1worldsync.com/static/pe/26_5_12_2/26_5_12_2/Content/fancybox3/jquery.fancybox.min.js"></script>

<script src="https://cdn.cs.1worldsync.com/static/pe/26_5_12_2/26_5_12_2/Content/qtip/jquery.qtip.modified.min.js"></script>
<script>
// Init after all CDN scripts have loaded (matches reference pattern where
// the init call is in a <script> block after all vendor scripts).
// HTML rendering is async (fetch), so poll for readiness.
(function waitAndInit() {
  if (!window._1wsHtmlReady) { setTimeout(waitAndInit, 50); return; }
  // Force qTip factory to run before init (side-effect module —
  // factory installs jQuery.fn.qtip but returns undefined)
  try { ccs_require('qtip'); } catch(e) {}
  init1WS();
})();
</script>
</body>
</html>
